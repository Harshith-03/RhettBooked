# PLACEHOLDER - illustrative values, not official BU data
_note: >-
  PLACEHOLDER - illustrative ASSUMED unit costs for a RECOGNISED BU STUDENT
  EVENT, not official BU or vendor quotes. Tuned to student-event reality: BU
  provides rooms, Wi-Fi, power, AV, security and custodial in-kind (see
  bu_in_kind), and catering is student-tier (pizza/snacks), so a 300-person
  overnight hackathon lands around $5k-$10k rather than a corporate gala budget.
currency: USD

# Resources BU provides at no cash charge for recognised student events. Any
# budget line whose key is listed here is zeroed and labelled
# "ASSUMED - BU resource (no charge)" (its in-kind value is still shown).
bu_in_kind:
  - venue_room          # BU event spaces, booked through Reservations
  - wifi                # campus Wi-Fi / temporary APs via IS&T
  - power               # existing building circuits
  - av_tech             # GSU / classroom AV support
  - security            # BUPD coverage for registered events
  - custodial           # Facilities cleaning

catering_per_head:
  # Student-tier catering: pizza, bagels, snacks - not plated/catered meals.
  lean:
    breakfast:
      low: 2.5
      high: 4
    lunch:
      low: 4
      high: 7
    dinner:
      low: 5
      high: 8
    snack:
      low: 1.5
      high: 3
  balanced:
    breakfast:
      low: 3.5
      high: 6
    lunch:
      low: 6
      high: 9
    dinner:
      low: 7
      high: 11
    snack:
      low: 2
      high: 4
  premium:
    breakfast:
      low: 5
      high: 8
    lunch:
      low: 8
      high: 13
    dinner:
      low: 11
      high: 17
    snack:
      low: 3
      high: 6

